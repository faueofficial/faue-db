[project]
name = "faue-db"
version = "0.1.0"
description = "FAUE SQLAlchemy models and the single Alembic project"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13", "pgvector"]

[tool.setuptools.packages.find]
include = ["faue_db*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
